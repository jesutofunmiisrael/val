<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Be My Valentine ❤️</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      text-align: center;
    }

    .box {
      position: relative;
      z-index: 2;
      padding: 20px;
      max-width: 90%;
    }

    h1 {
      font-size: clamp(22px, 5vw, 36px);
      margin-bottom: 25px;
    }

    button {
      padding: 12px 26px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      margin: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover { transform: scale(1.05); }

    #yes { background: #ff4d6d; color: white; }
    #no { background: #333; color: white; position: absolute; }

    /* small floating video */
    #introVideo {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 200px;
      height: auto;
      border-radius: 15px;
      z-index: 1;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    /* floating hearts */
    .heart {
      position: fixed;
      font-size: 24px;
      color: #ff4d6d;
      animation: float 3s linear infinite;
      pointer-events: none;
      z-index: 3;
    }

    @keyframes float {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-800px); opacity: 0; }
    }

    /* Responsive video for small screens */
    @media(max-width: 500px) {
      #introVideo {
        width: 120px;
        bottom: 10px;
        right: 10px;
      }
      h1 { font-size: clamp(18px, 6vw, 28px); }
      button { font-size: 16px; padding: 10px 20px; }
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Will you be my Valentine? ❤️</h1>
    <button id="yes">Yes</button>
    <button id="no">No</button>
  </div>

  <video id="introVideo" autoplay loop muted>
    <source src="./image/WhatsApp Video 2026-02-02 at 16.03.46.mp4" type="video/mp4">
  </video>

 
  <audio id="music" src="./audio/Edd_Sheeran_-_Perfect_(mp3.pm).mp3" loop></audio>

  <script>
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");
    const music = document.getElementById("music");

    // Move NO button
    function moveNo() {
      const maxX = window.innerWidth - 120;
      const maxY = window.innerHeight - 60;
      noBtn.style.left = Math.random() * maxX + "px";
      noBtn.style.top = Math.random() * maxY + "px";
    }
    noBtn.addEventListener("mouseenter", moveNo);
    noBtn.addEventListener("mousedown", moveNo);
    noBtn.addEventListener("touchstart", moveNo);
    setInterval(moveNo, 600);

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerText = "❤️";
      heart.style.left = Math.random() * window.innerWidth + "px";
      heart.style.fontSize = 20 + Math.random() * 20 + "px";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 3000);
    }
    setInterval(createHeart, 500);

    // YES clicked → show main Valentine message + video + music
    yesBtn.addEventListener("click", () => {
      music.play(); // start music
      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          justify-content:center;
          align-items:center;
          flex-direction:column;
          font-family:sans-serif;
          background:linear-gradient(135deg,#ff9a9e,#fad0c4);
          text-align:center;
          padding:20px;
        ">
          <h1>Yayyyyy ❤️🥰</h1>
          <h2>You’re officially my Valentine 💘</h2>

          <video class="media" autoplay loop controls style="max-width:90%; border-radius:15px;">
            <source src="./video/WhatsApp Video 2026-02-02 at 15.41.46.mp4" type="video/mp4">
          </video>

          <p>Best choice ever 😎</p>
        </div>
      `;
    });
  </script>

</body>
</html>
